# =============================================================================
#  imperviousness-segmentation — Pixi environment
# =============================================================================
#  Ambiente riproducibile (conda-forge + lockfile) per lo stack geospaziale +
#  CUDA per l'A100. Sostituisce il "balletto" di pip uninstall/install dei
#  vecchi notebook.
#
#  USO RAPIDO
#    pixi install -e gpu          # VM con A100 (Linux)
#    pixi install                 # Mac / sviluppo geo (CPU)
#    pixi run marimo              # apre Marimo (notebook reattivi)
#    pixi run -e gpu gpu-check    # verifica che la A100 sia vista da PyTorch
# =============================================================================

[workspace]
name = "imperviousness-segmentation"
version = "0.2.0"
description = "DL imperviousness segmentation from Sentinel-2 + OSM labels (YOLO-seg)"
channels = ["conda-forge"]
# linux-64 = VM A100; osx-64 = Mac Intel; osx-arm64 = Mac Apple Silicon
platforms = ["linux-64", "osx-64", "osx-arm64"]

# ----------------------------------------------------------------------------
#  Dipendenze comuni (geo + db + notebook) — girano su Mac e su Linux
# ----------------------------------------------------------------------------
[dependencies]
python = "3.11.*"

# --- geospatial core (versioni 2026, NON le pinnate del 2023) ---
gdal = ">=3.8"
geopandas = ">=1.0"
shapely = ">=2.0"
pyproj = ">=3.6"
rasterio = ">=1.3"
rioxarray = ">=0.15"
xarray = "*"
osmnx = ">=2.0"
folium = ">=0.17"
pyogrio = "*"

# --- data / sci ---
numpy = ">=1.26"
pandas = ">=2.2"
matplotlib = ">=3.8"
scipy = "*"
tqdm = "*"
pillow = "*"

# --- PostGIS access ---
sqlalchemy = ">=2.0"
geoalchemy2 = "*"
psycopg2 = "*"

# --- notebook & config ---
marimo = ">=0.9"
python-dotenv = "*"
ipython = "*"
pyyaml = ">=6.0"           # parametri pipeline in YAML

# --- Copernicus Data Space Ecosystem + STAC/COG ---
pystac-client = ">=0.8"    # ricerca sui cataloghi STAC (CDSE / Earth Search / PC)
odc-stac = "*"             # STAC -> xarray con lettura finestrata COG (ritaglio AoI)
boto3 = "*"                # richiesto da rasterio per le credenziali S3 (lettura COG da CDSE)

[pypi-dependencies]
# il pacchetto locale, installato editable -> importabile ovunque (notebook/script/REPL)
impervious = { path = ".", editable = true }
# cdsetool: download prodotti dal Copernicus Data Space Ecosystem (CDSE)
cdsetool = "*"
# planetary-computer: firma degli asset STAC di Microsoft Planetary Computer (opzionale)
planetary-computer = "*"
# detect-secrets: scansione segreti nel pre-commit hook (cross-platform, puro Python)
detect-secrets = "*"

# ----------------------------------------------------------------------------
#  Feature GPU — solo Linux/A100 (CUDA 12). Usata dall'environment "gpu".
# ----------------------------------------------------------------------------
[feature.gpu]
platforms = ["linux-64"]

# NB: pixi 0.71 emette un warning di deprecazione su [system-requirements] ma
# funziona; la sintassi inline `platforms=[{platform=..,cuda=..}]` non è ancora
# accettata da questa versione.
[feature.gpu.system-requirements]
cuda = "12"

[feature.gpu.dependencies]
pytorch-gpu = ">=2.2"
torchvision = "*"
ultralytics = ">=8.3"

# ----------------------------------------------------------------------------
#  Feature CPU — fallback per sviluppo locale (Mac / Linux senza GPU)
# ----------------------------------------------------------------------------
[feature.cpu.dependencies]
pytorch-cpu = ">=2.2"
torchvision = "*"
ultralytics = ">=8.3"

[environments]
default = { features = ["cpu"], solve-group = "cpu" }
gpu = { features = ["gpu"], solve-group = "gpu" }

# ----------------------------------------------------------------------------
#  Tasks
# ----------------------------------------------------------------------------
[tasks]
# Avvia Marimo accessibile via SSH tunnel (vedi scripts/launch_marimo.sh)
marimo = "marimo edit --headless --host 0.0.0.0 --port 2718 notebooks"
# Converte i vecchi .ipynb in notebook Marimo (.py) dentro notebooks/
convert = "bash scripts/convert_notebooks.sh"
# Verifica che PyTorch veda la A100
gpu-check = "python -c \"import torch; print('CUDA:', torch.cuda.is_available()); print('Device:', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'n/a')\""
